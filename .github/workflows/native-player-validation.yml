name: Native player rebuild validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/native-streaming-player-rebuild]

permissions:
  contents: read

jobs:
  validate:
    name: Install, regression tests, and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression and unit tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
